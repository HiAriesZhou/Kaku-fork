name: Build Validation

# Release-shaped build validation: universal (arm64 + x86_64) builds with the
# release-opt profile that releases and nightlies ship, plus app bundle
# assembly. They almost never break from routine Rust changes, so they do not
# gate every push. They run:
#   - on pushes that touch the build pipeline itself (scripts, dependency
#     graph, bundle assets),
#   - once a day as a backstop, skipped when that commit already passed,
#   - on demand (scripts/release.sh preflight checks the latest run is green
#     before starting a release; dispatch manually if it is stale).
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build.sh'
      - 'scripts/download_vendor.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/macos/**'
      - '.github/workflows/build-validation.yml'
  schedule:
    # Daily backstop at 18:30 UTC (02:30 Beijing), outside working hours.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The daily backstop has nothing new to learn from a commit that already
  # built green; the run still concludes success, which release.sh accepts.
  gate:
    name: Skip Already Validated Commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            passed=$(gh run list --repo "${{ github.repository }}" \
              --workflow build-validation.yml --commit "${{ github.sha }}" \
              --status success --limit 1 --json databaseId --jq 'length')
            if [[ "$passed" != "0" ]]; then
              build=false
              echo "${{ github.sha }} already passed Build Validation; skipping."
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # One job per architecture so the two fat-LTO builds run side by side.
  # The arm64 leg also assembles the app bundle from the binaries it just
  # built, instead of a separate job compiling arm64 a second time.
  build:
    name: Build ${{ matrix.arch }}
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            bundle: true
          - arch: x86_64
            target: x86_64-apple-darwin
            bundle: false
    env:
      PROFILE: release-opt
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build binaries
        run: |
          set -o pipefail
          cargo build --locked --profile "$PROFILE" --target ${{ matrix.target }} -p kaku-gui --bin kaku-gui 2>&1 | sed '/has no symbols/d'

      - name: Assemble app bundle
        if: matrix.bundle
        run: |
          set -o pipefail
          BUILD_ARCH=${{ matrix.arch }} ./scripts/build.sh --app-only 2>&1 | sed '/has no symbols/d'

      - name: Verify bundled shell plugins are pinned
        if: matrix.bundle
        run: |
          test -d dist/Kaku.app
          test "$(cat dist/Kaku.app/Contents/Resources/vendor/zsh-autosuggestions/.kaku-vendor-ref)" = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5"
          test "$(cat dist/Kaku.app/Contents/Resources/vendor/fast-syntax-highlighting/.kaku-vendor-ref)" = "3d574ccf48804b10dca52625df13da5edae7f553"
          test "$(cat dist/Kaku.app/Contents/Resources/vendor/zsh-completions/.kaku-vendor-ref)" = "84615f3d0b0e943d5b1de862c9552e572c8e70bb"

      - name: Verify the CLI names run the bundled binary
        if: matrix.bundle
        run: |
          set -euo pipefail
          for bin in kaku k; do
            test "$(readlink "dist/Kaku.app/Contents/MacOS/$bin")" = kaku-gui
          done
          test ! -e dist/Kaku.app/Contents/Frameworks
          version="$(dist/Kaku.app/Contents/MacOS/kaku --version)"
          [[ "$version" == "kaku "* ]]
          chat_help="$(dist/Kaku.app/Contents/MacOS/k --help)"
          [[ "$chat_help" == *"Usage: k "* ]]

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release-opt/kaku-gui
          if-no-files-found: error
          retention-days: 1

  universal:
    name: Universal Merge
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*

      - name: Lipo merge and verify
        run: |
          set -euo pipefail
          mkdir -p universal
          lipo -create -output universal/kaku-gui bin-arm64/kaku-gui bin-x86_64/kaku-gui
          lipo universal/kaku-gui -verify_arch arm64 x86_64
          lipo -info universal/kaku-gui

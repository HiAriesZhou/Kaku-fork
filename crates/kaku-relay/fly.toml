# fly.toml app configuration file generated for kaku-relay on 2026-03-25T12:55:28+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kaku-relay'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Each Mac holds one socket and each open page another, so 100 is about
  # 50 people online. The bound is memory, not fly's proxy: 256 MB holds the
  # relay-wide queue budget (96 MB), the built-in page files (about 1 MB)
  # and the sockets. Raise it only with a measured load test or a larger machine.
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 80
    hard_limit = 100

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

# fly.toml app configuration file generated for kaku-relay on 2026-03-25T12:55:28+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kaku-relay'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Each Mac holds one socket, each open page another, and offline pages
  # poll; fly's default of 25 would turn friends away. The relay sheds
  # floods itself (byte budgets, per-address and per-id caps).
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 800
    hard_limit = 1000

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
